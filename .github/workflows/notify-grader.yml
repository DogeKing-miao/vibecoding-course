name: Notify Grader

on:
  push:
    branches:
      - "student/**"

permissions:
  contents: read

jobs:
  notify:
    if: ${{ startsWith(github.ref_name, 'student/') && github.event.deleted == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch grader workflow
        env:
          GH_TOKEN: ${{ secrets.GRADER_DISPATCH_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing GRADER_DISPATCH_TOKEN secret"
            exit 1
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Shergould/vibecoding-grader/dispatches \
            -d "{\"event_type\":\"student_submission\",\"client_payload\":{\"branch\":\"${BRANCH_NAME}\",\"commit\":\"${COMMIT_SHA}\",\"actor\":\"${ACTOR}\"}}"
